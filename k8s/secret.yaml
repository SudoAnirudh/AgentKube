# SECURITY NOTICE:
# Kubernetes Secret values are Base64 ENCODED, NOT ENCRYPTED!
# Base64 encoding can be easily decoded using: `echo <value> | base64 -d`.
# In production, use Kubernetes secret encryption at rest (KMS envelope encryption)
# or external secret managers (e.g. AWS Secrets Manager, HashiCorp Vault, Azure Key Vault).

apiVersion: v1
kind: Secret
metadata:
  name: agent-secret
  namespace: agent-platform
  labels:
    app.kubernetes.io/name: agent-secret
    app.kubernetes.io/part-of: multi-agent-platform
type: Opaque
data:
  # Base64 encoded placeholder: "mock_api_key_placeholder" -> "bW9ja19hcGlfa2V5X3BsYWNlaG9sZGVy"
  LLM_API_KEY: bW9ja19hcGlfa2V5X3BsYWNlaG9sZGVy
