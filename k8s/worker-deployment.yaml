apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-worker
  namespace: agent-platform
  labels:
    app: agent-worker
    app.kubernetes.io/name: agent-worker
    app.kubernetes.io/part-of: multi-agent-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent-worker
  template:
    metadata:
      labels:
        app: agent-worker
    spec:
      containers:
        - name: agent-worker
          image: ai_infra-kuber-app:v1.0.0
          imagePullPolicy: IfNotPresent
          command:
            - celery
            - -A
            - app.workers.celery_app
            - worker
            - --loglevel=info
          envFrom:
            - configMapRef:
                name: agent-config
            - secretRef:
                name: agent-secret
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            exec:
              command:
                - celery
                - -A
                - app.workers.celery_app
                - inspect
                - ping
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 3
