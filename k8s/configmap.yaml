apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-config
  namespace: agent-platform
  labels:
    app.kubernetes.io/name: agent-config
    app.kubernetes.io/part-of: multi-agent-platform
data:
  REDIS_URL: "redis://agent-redis:6379/2"
  CELERY_BROKER_URL: "redis://agent-redis:6379/0"
  CELERY_RESULT_BACKEND: "redis://agent-redis:6379/1"
  CELERY_TASK_ALWAYS_EAGER: "False"
  MAX_RETRIES: "2"
  AGENT_TIMEOUT_SECONDS: "30.0"
  WORKER_CONCURRENCY: "1"
  LOG_LEVEL: "INFO"
  LLM_PROVIDER: "mock"
  LLM_MODEL: "llama-3.3-70b-versatile"
  LLM_BASE_URL: "https://api.groq.com/openai/v1"
