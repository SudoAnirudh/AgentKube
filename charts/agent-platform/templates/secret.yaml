# NOTE: Base64 encoding in Kubernetes Secrets is encoding, NOT encryption.
# Production deployments should inject secrets dynamically via KMS, Vault, or external secret providers.
apiVersion: v1
kind: Secret
metadata:
  name: agent-secret
  namespace: {{ .Values.namespace | default .Release.Namespace }}
  labels:
    app.kubernetes.io/name: agent-platform
    app.kubernetes.io/component: secret
type: Opaque
data:
  LLM_API_KEY: {{ .Values.secrets.llmApiKey | default "bW9ja19rZXlfMTIzNDU2Nzg5MA==" | b64enc | quote }}
