{{- if .Values.ui.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: agent-ui
  namespace: {{ .Values.namespace | default .Release.Namespace }}
  labels:
    app.kubernetes.io/name: agent-platform
    app.kubernetes.io/component: ui
spec:
  type: {{ .Values.ui.service.type }}
  ports:
    - port: {{ .Values.ui.service.port }}
      targetPort: 80
      protocol: TCP
      name: http
  selector:
    app: agent-ui
{{- end }}
