{{- if .Values.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: agent-external-secret
  namespace: {{ .Values.namespace | default .Release.Namespace }}
  labels:
    app.kubernetes.io/name: agent-platform
    app.kubernetes.io/component: external-secret
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | default "1h" | quote }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreName | default "aws-secrets-manager" | quote }}
    kind: ClusterSecretStore
  target:
    name: agent-secret
    creationPolicy: Owner
  data:
    - secretKey: LLM_API_KEY
      remoteRef:
        key: {{ .Values.externalSecrets.remoteKey | quote }}
        property: {{ .Values.externalSecrets.remoteProperty | default "LLM_API_KEY" | quote }}
{{- end }}
