# Default values for agent-platform Helm Chart

namespace: agent-platform

serviceAccount:
  create: true
  apiName: agent-api-sa
  workerName: agent-worker-sa
  redisName: agent-redis-sa
  annotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

api:
  replicaCount: 2
  terminationGracePeriodSeconds: 30
  image:
    repository: ai_infra-kuber-app
    tag: v1.1.0
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8000
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  pdb:
    enabled: true
    minAvailable: 1
  probes:
    liveness:
      path: /health
      initialDelaySeconds: 5
      periodSeconds: 10
    readiness:
      path: /ready
      initialDelaySeconds: 5
      periodSeconds: 5
  topologySpreadConstraints:
    enabled: true
    maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway

worker:
  replicaCount: 1
  terminationGracePeriodSeconds: 60
  image:
    repository: ai_infra-kuber-app
    tag: v1.1.0
    pullPolicy: IfNotPresent
  command:
    - celery
    - -A
    - app.workers.celery_app
    - worker
    - --loglevel=info
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 75
  pdb:
    enabled: true
    minAvailable: 1
  topologySpreadConstraints:
    enabled: true
    maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway

redis:
  replicaCount: 1
  terminationGracePeriodSeconds: 30
  image:
    repository: redis
    tag: "7-alpine"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 6379
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false
    capabilities:
      drop:
        - ALL

networkPolicy:
  enabled: true
  allowExternalIngress: true

config:
  redisUrl: redis://agent-redis:6379/2
  celeryBrokerUrl: redis://agent-redis:6379/0
  celeryResultBackend: redis://agent-redis:6379/1
  environment: kubernetes
  logLevel: INFO
  port: 8000

ingress:
  enabled: false
  className: nginx
  host: api.agentkube.example.com
  annotations: {}
  tls:
    enabled: true
    secretName: agentkube-tls-secret

externalSecrets:
  enabled: false
  secretStoreName: aws-secrets-manager
  remoteKey: agentkube/prod/llm_api_key
  remoteProperty: LLM_API_KEY
  refreshInterval: 1h

secrets:
  llmApiKey: "" # Supplied via --set-string secrets.llmApiKey="..." when ExternalSecret is disabled
