# Production Environment Configuration Overrides

api:
  replicaCount: 3
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi

worker:
  replicaCount: 2
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi

config:
  environment: production
  logLevel: WARNING

ingress:
  enabled: true
  className: nginx
  host: api.agentkube.example.com
  tls:
    enabled: true
    secretName: agentkube-tls-secret

externalSecrets:
  enabled: true
  secretStoreName: aws-secrets-manager
  remoteKey: agentkube/prod/llm_api_key
  remoteProperty: LLM_API_KEY
  refreshInterval: 1h
