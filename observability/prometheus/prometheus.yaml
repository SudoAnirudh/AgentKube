global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "/etc/prometheus/rules.yaml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - "alertmanager.monitoring.svc.cluster.local:9093"

scrape_configs:
  - job_name: "agent-api"
    metrics_path: "/metrics"
    static_configs:
      - targets:
          - "agent-api.agent-platform.svc.cluster.local:8000"

  - job_name: "kube-state-metrics"
    static_configs:
      - targets:
          - "kube-state-metrics.monitoring.svc.cluster.local:8080"

  - job_name: "node-exporter"
    static_configs:
      - targets:
          - "node-exporter.monitoring.svc.cluster.local:9100"

  - job_name: "redis"
    static_configs:
      - targets:
          - "agent-redis.agent-platform.svc.cluster.local:6379"
