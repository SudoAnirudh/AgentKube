name: CI Pipeline

on:
  push:
    branches: [ main, dev, feature/* ]
  pull_request:
    branches: [ main, dev ]

jobs:
  lint-and-test:
    name: Lint & Unit/Integration Tests
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Pytest Suite
        run: |
          pytest -v

  helm-validation:
    name: Helm Chart Lint & Template Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.17.1'

      - name: Lint Helm Chart
        run: |
          helm lint ./charts/agent-platform

      - name: Render Helm Template (Dev)
        run: |
          helm template agent-platform ./charts/agent-platform -f charts/agent-platform/values-dev.yaml

      - name: Render Helm Template (Prod)
        run: |
          helm template agent-platform ./charts/agent-platform -f charts/agent-platform/values-prod.yaml
